<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemtrack · Вход — варианты (макет)</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0c0c0e; --s1:#141416; --s2:#1b1b1e; --s3:#232327; --line:#ffffff0f; --line2:#ffffff17;
    --ink:#ecebe8; --ink2:#a7a5a0; --mute:#76746f;
    --ac:#b8f25c; --acg:#b8f25c55; --acs:#b8f25c1a; --stop:#ff7a7a;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font-family:"Geist",ui-sans-serif,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .stage { position:fixed; inset:0; display:grid; place-items:center; }
  .stage::after { content:""; position:absolute; inset:0; pointer-events:none; background:radial-gradient(60% 60% at 50% 50%, transparent 30%, #0c0c0ecc 100%); }
  .center { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:22px; }

  /* кнопка Steam — общая для всех вариантов */
  .steam { height:50px; padding:0 22px 0 18px; border-radius:999px; display:inline-flex; align-items:center; gap:12px; font-weight:600; font-size:14.5px;
           background:#141416; border:1px solid var(--line2); box-shadow:0 14px 40px #0009, inset 0 1px 0 #ffffff0d;
           transition:border-color 200ms, box-shadow 200ms, background-color 200ms, color 200ms; }
  .steam:hover { border-color:#b8f25c99; box-shadow:0 14px 40px #0009, 0 0 0 4px #b8f25c14, 0 0 30px #b8f25c33; }
  .steam:focus-visible { outline:2px solid var(--ac); outline-offset:3px; }
  .steam svg { flex:none; }
  .steam.go { background:var(--ac); color:#0c0c0e; border-color:transparent; box-shadow:0 0 30px var(--acg); }
  .steam.wait { color:var(--ink2); cursor:default; }
  .spin { width:16px; height:16px; border-radius:999px; border:2px solid #ffffff22; border-top-color:var(--ac); animation:sp 800ms linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }

  /* короткая подпись состояния — одна строка, без объяснений */
  .note { height:26px; display:inline-flex; align-items:center; gap:8px; padding:0 12px; border-radius:999px; font-size:12px; background:#141416cc; border:1px solid var(--line); color:var(--ink2); backdrop-filter:blur(6px); opacity:0; transform:translateY(-4px); transition:opacity 200ms, transform 200ms; }
  .note.show { opacity:1; transform:none; }
  .note i { width:6px; height:6px; border-radius:999px; background:var(--ac); }
  .note.bad { color:#ffb0b0; } .note.bad i { background:var(--stop); }

  /* ── A · Ядро ── */
  .A .core { position:relative; width:120px; height:120px; display:grid; place-items:center; }
  .A .core::before { content:""; position:absolute; inset:-60px; border-radius:999px; background:radial-gradient(circle, #b8f25c2a, transparent 62%); animation:breathe 4.5s ease-in-out infinite; }
  .A .core .tile { position:relative; width:88px; height:88px; border-radius:26px; background:linear-gradient(180deg,#1d1d21,#141416); border:1px solid var(--line2); box-shadow:0 20px 50px #000a, inset 0 1px 0 #ffffff12; display:grid; place-items:center; }
  .A .core svg { filter:drop-shadow(0 0 12px var(--acg)); }
  .A .ring { position:absolute; inset:-14px; border-radius:999px; border:1px dashed #b8f25c33; animation:rot 40s linear infinite; }
  .A .ring::after { content:""; position:absolute; top:-3px; left:50%; width:6px; height:6px; margin-left:-3px; border-radius:999px; background:var(--ac); box-shadow:0 0 10px var(--ac); }
  .A .word { font-size:11px; letter-spacing:.42em; padding-left:.42em; color:var(--mute); font-weight:500; }
  @keyframes breathe { 50% { opacity:.55; transform:scale(.94); } }
  @keyframes rot { to { transform:rotate(360deg); } }

  /* ── B · Холст ── */
  .B .center { position:fixed; left:50%; bottom:44px; translate:-50% 0; gap:12px; }
  .B .dock { display:flex; align-items:center; gap:8px; padding:7px 7px 7px 16px; border-radius:999px; background:#16161aee; border:1px solid var(--line2); box-shadow:0 24px 60px #000b, inset 0 1px 0 #ffffff0d; backdrop-filter:blur(10px); }
  .B .dock .mark { display:flex; align-items:center; gap:8px; padding-right:10px; border-right:1px solid var(--line2); font-weight:600; font-size:13px; }
  .B .dock .mark svg { filter:drop-shadow(0 0 6px var(--acg)); }
  .B .dock .steam { height:42px; box-shadow:none; }

  /* ── C · Тишина ── */
  .C .stage::after { display:none; }
  .C .steam { background:transparent; border-color:transparent; box-shadow:none; color:var(--ink2); }
  .C .steam:hover { color:var(--ink); background:#ffffff06; border-color:var(--line2); box-shadow:none; }
  .C .steam.go { background:var(--ac); color:#0c0c0e; }
  .C .dot { width:8px; height:8px; border-radius:999px; background:var(--ac); box-shadow:0 0 14px var(--ac); animation:pulse 2.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.35; box-shadow:0 0 4px var(--ac); } }

  /* переключатели макета */
  .bar { position:fixed; left:50%; top:16px; translate:-50% 0; z-index:9; display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; max-width:calc(100% - 24px); }
  .seg { display:inline-flex; gap:2px; padding:3px; border-radius:999px; background:#141416ee; border:1px solid var(--line2); backdrop-filter:blur(8px); }
  .seg button { height:28px; padding:0 12px; border-radius:999px; color:var(--ink2); font-size:12px; white-space:nowrap; transition:background-color 150ms,color 150ms; }
  .seg button.on { background:var(--s3); color:var(--ink); }
  .seg button.on.v { background:var(--acs); color:var(--ac); }
  .tag { color:var(--mute); font-size:11px; }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>
</head>
<body class="A">
<canvas id="bg"></canvas>
<div class="stage"><div class="center" id="center"></div></div>

<div class="bar">
  <div class="seg" id="vs"><button class="on v" data-v="A">A · Ядро</button><button data-v="B">B · Холст</button><button data-v="C">C · Тишина</button></div>
  <div class="seg" id="ss"><button class="on" data-s="plain">обычный</button><button data-s="invite">приглашение</button><button data-s="busy">ждём Steam</button><button data-s="denied">нет доступа</button><button data-s="off">закрыт</button><button data-s="welcome">первый вход</button></div>
  <span class="tag">переключатели есть только в макете</span>
</div>

<script>
const STEAM = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-9.96 9.2l5.36 2.22a2.8 2.8 0 0 1 1.6-.5h.16l2.39-3.46v-.05a3.79 3.79 0 1 1 3.79 3.79h-.09l-3.4 2.43v.13a2.85 2.85 0 0 1-5.65.5L2.37 14.6A10 10 0 1 0 12 2Zm-4.7 15.2-1.23-.5a2.13 2.13 0 0 0 3.92-.17 2.13 2.13 0 0 0-1.16-2.78 2.14 2.14 0 0 0-1.57-.03l1.27.53a1.57 1.57 0 1 1-1.2 2.9Zm9.23-6.1a2.52 2.52 0 1 0-2.52-2.53 2.53 2.53 0 0 0 2.52 2.53Zm0-4.42a1.9 1.9 0 1 1-1.89 1.9 1.9 1.9 0 0 1 1.89-1.9Z"/></svg>';
const GEM = s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="#b8f25c" stroke-width="1.5"><path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20M12 21 8 9l4-6 4 6z"/></svg>`;
let V = 'A', S = 'plain';

// Одна строка на состояние. Никаких объяснений — кто зашёл случайно, ничего не узнает.
const NOTE = { plain:null, invite:['приглашение · Дима', ''], busy:null, denied:['нет доступа', 'bad'], off:['доступ закрыт', 'bad'], welcome:['вход привязан', ''] };
function button() {
  if (S === 'busy') return `<button class="steam wait"><span class="spin"></span>Steam…</button>`;
  if (S === 'welcome') return `<button class="steam go">Добавить аккаунт</button>`;
  if (S === 'off') return '';
  return `<button class="steam" data-go>${STEAM}${S === 'denied' ? 'Другой аккаунт' : 'Войти через Steam'}</button>`;
}
function note() { const n = NOTE[S]; return `<span class="note ${n ? 'show ' + n[1] : ''}"><i></i>${n ? n[0] : ''}</span>`; }

function render() {
  document.body.className = V;
  document.querySelectorAll('#vs button').forEach(b => b.classList.toggle('on', b.dataset.v === V) || b.classList.toggle('v', b.dataset.v === V));
  document.querySelectorAll('#vs button').forEach(b => b.classList.toggle('v', b.dataset.v === V));
  document.querySelectorAll('#ss button').forEach(b => b.classList.toggle('on', b.dataset.s === S));
  const c = document.getElementById('center');
  if (V === 'A') c.innerHTML = `<div class="core"><span class="ring"></span><div class="tile">${GEM(38)}</div></div><div class="word">GEMTRACK</div>${button()}${note()}`;
  if (V === 'B') c.innerHTML = `${note()}<div class="dock"><span class="mark">${GEM(18)}Gemtrack</span>${button() || '<span style="padding:0 14px 0 4px;color:var(--mute);font-size:13px">—</span>'}</div>`;
  if (V === 'C') c.innerHTML = `<span class="dot"></span>${button()}${note()}`;
  c.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { S = 'busy'; render(); setTimeout(() => { if (S === 'busy') { S = 'welcome'; render(); } }, 1600); });
  bgMode();
}
document.querySelectorAll('#vs button').forEach(b => b.onclick = () => { V = b.dataset.v; render(); });
document.querySelectorAll('#ss button').forEach(b => b.onclick = () => { S = b.dataset.s; render(); });

/* фон: A — частицы вокруг центра, B — живой граф с откликом на мышь, C — ничего */
const cv = document.getElementById('bg'), x = cv.getContext('2d');
let W, H, D = devicePixelRatio || 1, nodes = [], mouse = { x:-1e9, y:-1e9 };
function size() { W = cv.width = innerWidth * D; H = cv.height = innerHeight * D; seed(); }
function seed() {
  const n = V === 'B' ? 56 : 40;
  nodes = Array.from({ length:n }, (_, i) => ({ x:Math.random() * W, y:Math.random() * H, vx:(Math.random() - .5) * .25 * D, vy:(Math.random() - .5) * .25 * D, a:Math.random() * Math.PI * 2, r0:(120 + Math.random() * 260) * D, sp:(.0006 + Math.random() * .0012) * (Math.random() < .5 ? 1 : -1), hub:i < (V === 'B' ? 7 : 0) }));
}
let lastV = null;
function bgMode() { if (V !== lastV) { lastV = V; seed(); } }
addEventListener('resize', size);
addEventListener('mousemove', e => { mouse.x = e.clientX * D; mouse.y = e.clientY * D; });
size();
(function loop() {
  x.clearRect(0, 0, W, H);
  if (V === 'A') {
    const cx = W / 2, cy = H / 2 - 30 * D;
    for (const n of nodes) {
      n.a += n.sp; const px = cx + Math.cos(n.a) * n.r0, py = cy + Math.sin(n.a) * n.r0 * .62;
      const far = n.r0 / (380 * D);
      x.fillStyle = `rgba(236,235,232,${.5 - far * .35})`; x.beginPath(); x.arc(px, py, 1.4 * D, 0, 7); x.fill();
      n.px = px; n.py = py;
    }
    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j], d = Math.hypot(a.px - b.px, a.py - b.py);
      if (d < 90 * D) { x.strokeStyle = `rgba(184,242,92,${(1 - d / (90 * D)) * .25})`; x.lineWidth = D; x.beginPath(); x.moveTo(a.px, a.py); x.lineTo(b.px, b.py); x.stroke(); }
    }
  } else if (V === 'B') {
    for (const n of nodes) {
      const dx = mouse.x - n.x, dy = mouse.y - n.y, dm = Math.hypot(dx, dy);
      if (dm < 220 * D) { n.vx += dx / dm * .02 * D; n.vy += dy / dm * .02 * D; }
      n.vx *= .985; n.vy *= .985; n.vx += (Math.random() - .5) * .01 * D; n.vy += (Math.random() - .5) * .01 * D;
      n.x += n.vx; n.y += n.vy;
      if (n.x < 0 || n.x > W) n.vx *= -1; if (n.y < 0 || n.y > H) n.vy *= -1;
    }
    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j], d = Math.hypot(a.x - b.x, a.y - b.y), lim = (a.hub || b.hub ? 210 : 120) * D;
      if (d < lim) { x.strokeStyle = `rgba(184,242,92,${(1 - d / lim) * (a.hub || b.hub ? .3 : .12)})`; x.lineWidth = D; x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(b.x, b.y); x.stroke(); }
    }
    for (const n of nodes) {
      x.fillStyle = n.hub ? '#b8f25c' : 'rgba(236,235,232,.55)';
      if (n.hub) { x.shadowColor = '#b8f25c'; x.shadowBlur = 12 * D; }
      x.beginPath(); x.arc(n.x, n.y, (n.hub ? 3.2 : 1.5) * D, 0, 7); x.fill(); x.shadowBlur = 0;
    }
  }
  requestAnimationFrame(loop);
})();
render();
</script>
</body>
</html>
