<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Ни названия, ни описания: случайный посетитель не должен понять, что это. -->
<title>Вход</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='4' fill='%23b8f25c'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0b0b0d; --ink:#ecebe8; --ink2:#a7a5a0; --mute:#5f5d59;
    --ac:#b8f25c; --stop:#ff7a7a;
    --tone:var(--ac);
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font-family:"Geist",ui-sans-serif,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; transition:opacity 600ms; }

  .center { position:fixed; inset:0; display:grid; place-items:center; pointer-events:none; }
  .col { display:flex; flex-direction:column; align-items:center; gap:28px; pointer-events:auto; transition:opacity 500ms; }

  /* ── маяк: одна точка ──
     Мерцает не сама точка, а её свечение (::after) — чтобы смена состояния
     могла спокойно менять у точки размер и прозрачность. */
  .beacon { position:relative; width:120px; height:64px; display:grid; place-items:center; }
  .dot { position:relative; width:9px; height:9px; border-radius:999px; background:var(--tone);
         transition:background-color 400ms, width 450ms cubic-bezier(.2,.8,.2,1), height 450ms, border-radius 450ms, transform 700ms cubic-bezier(.4,0,.2,1), opacity 400ms; }
  .dot::after { content:""; position:absolute; inset:-8px; border-radius:999px; background:radial-gradient(circle, var(--tone), transparent 65%); opacity:.55; animation:glow 3.4s ease-in-out infinite; transition:opacity 300ms; }
  @keyframes glow { 50% { opacity:.2; } }
  .ring { position:absolute; left:50%; top:50%; width:9px; height:9px; margin:-4.5px 0 0 -4.5px; border-radius:999px; border:1px solid var(--tone); opacity:0; animation:ping 4.8s cubic-bezier(.2,.6,.3,1) infinite; }
  .ring.r2 { animation-delay:1.6s; }
  @keyframes ping { 0% { transform:scale(1); opacity:.55; } 70%,100% { transform:scale(7); opacity:0; } }
  body.hot .dot::after { opacity:.9; animation:none; }

  /* ── приглашение: две точки и нить между ними — «тебя ждут» ── */
  .pair { position:absolute; inset:0; display:none; align-items:center; justify-content:center; }
  .pair .a, .pair .b { width:9px; height:9px; border-radius:999px; flex:none; }
  .pair .a { background:var(--ac); box-shadow:0 0 14px var(--ac); }
  .pair .b { background:var(--ink); opacity:.85; box-shadow:0 0 10px #ecebe866; }
  .pair .thread { position:relative; width:72px; height:1px; margin:0 6px; background:linear-gradient(90deg, #b8f25c88, #ecebe844); overflow:visible; }
  .pair .thread i { position:absolute; top:-2px; left:0; width:5px; height:5px; border-radius:999px; background:var(--ac); box-shadow:0 0 8px var(--ac); animation:travel 2.4s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes travel { 0% { left:0; opacity:0; } 15% { opacity:1; } 85% { opacity:1; } 100% { left:calc(100% - 5px); opacity:0; } }
  body.invite .pair { display:flex; }
  body.invite .dot, body.invite .ring { display:none; }
  .who { height:18px; font-size:15px; color:var(--ink2); letter-spacing:.01em; }

  /* ждём Steam: точка вытягивается в бегущую полоску */
  body.busy .dot { width:64px; height:2px; border-radius:2px; background:linear-gradient(90deg, transparent, var(--ac), transparent); background-size:200% 100%; animation:run 1.1s linear infinite; }
  body.busy .dot::after, body.busy .ring { display:none; }
  @keyframes run { from { background-position:100% 0; } to { background-position:-100% 0; } }

  /* стоп: красная, неподвижная, без колец */
  body.stop { --tone:var(--stop); }
  body.stop .dot::after { animation:none; opacity:.35; }
  body.stop .ring { display:none; }

  /* вошёл: маяк разгорается, всё гаснет — дальше панель */
  .veil { position:fixed; inset:0; background:var(--bg); opacity:0; pointer-events:none; transition:opacity 700ms 250ms; }
  body.enter .dot { transform:scale(26); opacity:0; }
  body.enter .dot::after, body.enter .ring { display:none; }
  body.enter .col > :not(.beacon) { opacity:0; transition:opacity 250ms; }
  body.enter canvas { opacity:0; }
  body.enter .veil { opacity:1; }
  .after { position:fixed; inset:0; display:grid; place-items:center; padding:0 24px; text-align:center; line-height:1.5; color:var(--mute); font-size:12px; opacity:0; transition:opacity 400ms 900ms; pointer-events:none; }
  body.enter .after { opacity:1; }

  /* ── кнопка ── */
  .act { position:relative; height:46px; min-width:46px; display:grid; place-items:center; }
  .btn { height:46px; padding:0 20px 0 16px; border-radius:999px; display:inline-flex; align-items:center; gap:11px; font-size:14px; font-weight:500; color:var(--ink2);
         border:1px solid transparent; transition:color 200ms, background-color 200ms, border-color 200ms, box-shadow 200ms; }
  .btn svg { opacity:.75; transition:opacity 200ms; }
  .btn:hover, .btn:focus-visible { color:var(--ink); background:#ffffff06; border-color:#ffffff1a; outline:none; }
  .btn:hover svg, .btn:focus-visible svg { opacity:1; }
  .btn:focus-visible { box-shadow:0 0 0 3px #b8f25c33; }
  .btn[disabled] { cursor:default; }
  .btn[disabled]:hover { background:none; border-color:transparent; color:var(--ink2); }

  /* одна строка под кнопкой — только когда пускать нельзя */
  .line { height:16px; font-size:12px; letter-spacing:.02em; color:#c98b8b; }

  /* переключатель — только в макете */
  .mock { position:fixed; left:50%; bottom:18px; translate:-50% 0; display:flex; gap:2px; padding:3px; border-radius:999px; background:#141416ee; border:1px solid #ffffff14; max-width:calc(100% - 24px); overflow-x:auto; scrollbar-width:none; z-index:5; }
  .mock::-webkit-scrollbar { display:none; }
  .mock button { height:28px; padding:0 12px; border-radius:999px; color:#8d8b86; font-size:12px; white-space:nowrap; }
  .mock button.on { background:#232327; color:var(--ink); }

  @media (prefers-reduced-motion: reduce) {
    .dot::after, .ring, .pair .thread i { animation:none !important; }
    .ring { display:none; }
    body.enter .dot { transform:none; }
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="center">
  <div class="col">
    <div class="who" id="who"></div>
    <div class="beacon" aria-hidden="true">
      <span class="dot"></span><span class="ring"></span><span class="ring r2"></span>
      <span class="pair"><span class="a"></span><span class="thread"><i></i></span><span class="b"></span></span>
    </div>
    <div class="act" id="act"></div>
    <div class="line" id="line" role="status" aria-live="polite"></div>
  </div>
</div>
<div class="veil"></div>
<div class="after">в настоящей панели здесь открывается Обзор — или «Привяжите первый аккаунт», если аккаунтов ещё нет</div>

<div class="mock" id="mock">
  <button class="on" data-s="plain">обычный</button><button data-s="invite">приглашение</button><button data-s="busy">ждём Steam</button><button data-s="denied">нет доступа</button><button data-s="off">закрыт</button><button data-s="enter">вошёл</button>
</div>

<script>
const STEAM = '<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-9.96 9.2l5.36 2.22a2.8 2.8 0 0 1 1.6-.5h.16l2.39-3.46v-.05a3.79 3.79 0 1 1 3.79 3.79h-.09l-3.4 2.43v.13a2.85 2.85 0 0 1-5.65.5L2.37 14.6A10 10 0 1 0 12 2Zm-4.7 15.2-1.23-.5a2.13 2.13 0 0 0 3.92-.17 2.13 2.13 0 0 0-1.16-2.78 2.14 2.14 0 0 0-1.57-.03l1.27.53a1.57 1.57 0 1 1-1.2 2.9Zm9.23-6.1a2.52 2.52 0 1 0-2.52-2.53 2.53 2.53 0 0 0 2.52 2.53Zm0-4.42a1.9 1.9 0 1 1-1.89 1.9 1.9 1.9 0 0 1 1.89-1.9Z"/></svg>';
const LOGIN = `<button class="btn" data-go>${STEAM}Войти через Steam</button>`;

// Состояние = вид маяка. Слова — только отказ; имени приглашённого нет нарочно.
const ST = {
  plain:  { cls:'',       who:'',     btn:LOGIN, line:'' },
  invite: { cls:'invite', who:'',     btn:LOGIN, line:'' },
  busy:   { cls:'busy',   who:'',     btn:`<button class="btn" disabled>Steam…</button>`, line:'' },
  denied: { cls:'stop',   who:'',     btn:`<button class="btn" data-go>${STEAM}Другой аккаунт</button>`, line:'нет доступа' },
  off:    { cls:'stop',   who:'',     btn:'', line:'доступ закрыт' },
  enter:  { cls:'enter',  who:'',     btn:'', line:'' },
};
let S = 'plain', from = 'plain';
function render() {
  const s = ST[S];
  document.body.className = s.cls;
  document.getElementById('who').textContent = s.who;
  document.getElementById('act').innerHTML = s.btn;
  document.getElementById('line').textContent = s.line;
  document.querySelectorAll('#mock button').forEach(b => b.classList.toggle('on', b.dataset.s === S));
  const go = document.querySelector('[data-go]');
  if (go) {
    go.onclick = () => { from = S; S = 'busy'; render(); setTimeout(() => { if (S === 'busy') { S = 'enter'; render(); } }, 1800); };
    go.onmouseenter = go.onfocus = () => document.body.classList.add('hot');
    go.onmouseleave = go.onblur = () => document.body.classList.remove('hot');
  }
}
document.querySelectorAll('#mock button').forEach(b => b.onclick = () => { S = b.dataset.s; render(); });
render();

/* Фон: сетка точек, которая проступает только под «фонарём» — у курсора
   или, если мыши нет, у медленно плывущего пятна. */
const cv = document.getElementById('bg'), x = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H, D = Math.min(devicePixelRatio || 1, 2);
const GAP = 26;
const lamp = { x:innerWidth / 2, y:innerHeight / 2, tx:innerWidth / 2, ty:innerHeight / 2 };
let lastMove = 0;
function size() { W = cv.width = innerWidth * D; H = cv.height = innerHeight * D; }
addEventListener('resize', size); size();
addEventListener('pointermove', e => { lamp.tx = e.clientX; lamp.ty = e.clientY; lastMove = performance.now(); });
(function loop(t) {
  if (performance.now() - lastMove > 4000) {
    const a = (t || 0) / 9000;
    lamp.tx = innerWidth / 2 + Math.cos(a) * innerWidth * .22;
    lamp.ty = innerHeight / 2 + Math.sin(a * 1.3) * innerHeight * .2;
  }
  lamp.x += (lamp.tx - lamp.x) * (reduce ? 1 : .06);
  lamp.y += (lamp.ty - lamp.y) * (reduce ? 1 : .06);
  x.clearRect(0, 0, W, H);
  const stop = document.body.classList.contains('stop');
  const R = 240, col = stop ? [255, 122, 122] : [184, 242, 92];
  for (let gy = GAP / 2; gy < innerHeight; gy += GAP) for (let gx = GAP / 2; gx < innerWidth; gx += GAP) {
    const d = Math.hypot(gx - lamp.x, gy - lamp.y);
    const k = Math.max(0, 1 - d / R);
    const a = .045 + k * k * .4;
    x.fillStyle = k > 0 ? `rgba(${col[0]},${col[1]},${col[2]},${a})` : 'rgba(236,235,232,.045)';
    x.beginPath(); x.arc(gx * D, gy * D, (1 + k * .6) * D, 0, 7); x.fill();
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
